<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GARHY TECH Command Center</title>
  <desc id="desc">Executive engineering identity banner for GARHY TECH.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#14313a" stroke-width="1" opacity="0.42"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="304" rx="18" fill="none" stroke="#0d5b68" stroke-width="1"/>
  <path d="M52 72H240M960 72h188M52 286h128M1020 286h128" stroke="#00e5ff" stroke-width="2" opacity="0.65"/>
  <circle cx="62" cy="51" r="5" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="82" cy="51" r="5" fill="#2dd4bf" opacity="0.8"/>
  <circle cx="102" cy="51" r="5" fill="#64748b" opacity="0.8"/>
  <text x="72" y="118" fill="#72f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">GARHY // EXECUTIVE ENGINEERING SYSTEM</text>
  <text x="72" y="190" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="3">GARHY TECH</text>
  <text x="74" y="230" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">SOFTWARE • AI • AUTOMATION • CLOUD • SECURITY • DEVOPS</text>
  <text x="74" y="275" fill="#00e5ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">BUILD  /  SECURE  /  AUTOMATE  /  SCALE</text>
  <g transform="translate(970 134)">
    <rect width="158" height="82" rx="12" fill="#07131a" stroke="#0d5b68"/>
    <text x="18" y="30" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">SYSTEM</text>
    <circle cx="21" cy="55" r="6" fill="#22c55e"/>
    <text x="38" y="60" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">OPERATIONAL</text>
  </g>
</svg>
