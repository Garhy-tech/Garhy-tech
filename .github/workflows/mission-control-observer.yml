name: Mission Control Observer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-mission-control.mjs'
      - 'docs/data/registry.json'
      - 'docs/data/topology.json'
      - 'docs/data/slo-policy.json'
      - 'docs/data/remediation-policy.json'
      - '.github/workflows/mission-control-observer.yml'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: mission-control-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository without external actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -B main FETCH_HEAD

      - name: Refresh public engineering intelligence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-mission-control.mjs

      - name: Validate generated intelligence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-profile.mjs

      - name: Commit observer state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json docs/data/incidents.json docs/data/observer.json docs/data/forecast.json docs/data/change-intelligence.json docs/data/slo.json docs/data/impact.json docs/data/recommendations.json
          if git diff --cached --quiet; then
            echo "No observer state change."
            exit 0
          fi
          git commit -m "chore(engineering-os): refresh public intelligence"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
