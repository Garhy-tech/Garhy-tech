name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2300e5ff
            assets/github-contribution-grid-snake-light.svg?palette=github&color_snake=%2300a8c6

      - name: Commit generated assets
        run: |
          if git diff --quiet -- assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-light.svg; then
            echo "No contribution snake change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-light.svg
          git commit -m "chore(profile): refresh contribution snake"
          git push
