name: Profile Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: profile-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate public Engineering OS
        run: |
          node --version
          node scripts/validate-profile.mjs
